<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - Grana Simples</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body class="login-page">

<div class="login-container">
    <div class="auth-card-header">
        <a href="/" class="brand-lockup">
            <span class="brand-mark">G</span>
            <span>GranaSimples</span>
        </a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Alternar tema">
            <span class="theme-icon-moon">☾</span>
            <span class="theme-icon-sun">☀</span>
        </button>
    </div>

    <h1>Criar conta</h1>
    <p>Comece a organizar sua vida financeira</p>

    {% if erro %}
        <div class="toast toast-erro">{{ erro }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.register') }}">
        <input type='hidden' name="csrf_token" value="{{ csrf_token() }}">

        <label class="auth-field">
            <span>Nome</span>
            <input type="text" name="nome" placeholder="Seu nome" value="{{ nome or '' }}" autocomplete="name" required autofocus>
        </label>

        <label class="auth-field">
            <span>Email</span>
            <input type="email" name="email" placeholder="seu@email.com" value="{{ email or '' }}" autocomplete="email" required>
        </label>

        <label class="auth-field">
            <span>Senha</span>
            <div class="password-field">
                <input type="password" name="senha" placeholder="Crie uma senha" minlength="8" autocomplete="new-password" required>
                <button type="button" class="password-toggle" aria-label="Mostrar senha">Mostrar</button>
            </div>
            <small class="auth-help">Use pelo menos 8 caracteres.</small>
        </label>

        <label class="auth-field">
            <span>Confirmar senha</span>
            <div class="password-field">
                <input type="password" name="confirmar_senha" placeholder="Digite a senha novamente" minlength="8" autocomplete="new-password" required>
                <button type="button" class="password-toggle" aria-label="Mostrar senha">Mostrar</button>
            </div>
        </label>

        <label class="auth-field auth-field-checkbox">
            <input
                type="checkbox"
                name="aceitar_termos"
                id="aceitar_termos"
                required
                style="width:auto;margin-right:0.5rem;accent-color:var(--petrol,#0e7490);"
            >
            <span style="font-size:0.875rem;line-height:1.5;">
                Li e aceito os
                <a href="{{ url_for('legal.termos') }}" target="_blank" rel="noopener">Termos de Uso</a>
                e a
                <a href="{{ url_for('legal.privacidade') }}" target="_blank" rel="noopener">Política de Privacidade</a>.
            </span>
        </label>

        <button type="submit" class="btn">Criar conta</button>
    </form>

    <p class="auth-footer">
        Já tem conta?
        <a href="{{ url_for('auth.login') }}">Entrar</a>
    </p>

</div>

<script src="{{ url_for('static', filename='js/auth.js') }}" defer></script>

</body>
</html>
